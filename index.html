<!doctype html>
<html lang="es" data-direction="verdigris" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DocuMind — Ask your documents</title>
    <meta
      name="description"
      content="DocuMind — an AI document assistant that answers questions about your PDFs and notes with exact source citations. Bilingual (ES/EN), light/dark, four color themes. React + TypeScript + Tailwind."
    />
    <meta name="theme-color" content="#07110d" />
    <!-- Open Graph / social cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DocuMind — Ask your documents" />
    <meta
      property="og:description"
      content="AI document assistant with inline citations, source cards, and a slide-in original-document viewer. React + TypeScript + Tailwind."
    />
    <!-- Add og:image once deployed, e.g. <meta property="og:image" content="https://<your-app>.vercel.app/og.png" /> -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DocuMind — Ask your documents" />
    <meta
      name="twitter:description"
      content="AI document assistant with source citations. React + TypeScript + Tailwind."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Apply persisted theme/language before paint to avoid a flash of the default palette. -->
    <script>
      (function () {
        try {
          var r = document.documentElement;
          var dir = localStorage.getItem('dm-dir-v2');
          var mode = localStorage.getItem('dm-mode');
          var lang = localStorage.getItem('dm-lang');
          if (dir) r.dataset.direction = dir;
          if (mode) r.dataset.mode = mode;
          if (lang) r.setAttribute('lang', lang);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
